services:
  # Modo de transição para servidores que já possuem Caddy/NGINX no host.
  # Somente loopback é publicado; nada fica exposto diretamente à LAN/Internet.
  hub-core:
    ports:
      - "${HUB_LOCAL_BIND:-127.0.0.1}:${HUB_LOCAL_PORT:-3083}:80"

  totem-api:
    ports:
      - "${TOTEM_LOCAL_BIND:-127.0.0.1}:${TOTEM_LOCAL_PORT:-3080}:3080"

  # Publica o Face Scanner para testes independentes na rede local.
  face-scanner:
    ports:
      - "0.0.0.0:8092:8091"
